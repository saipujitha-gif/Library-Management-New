
{% extends "base.html" %}

{% block content %}

<h2>My Profile</h2>

<div class="card">

    <h3>Account Information</h3>

    <p><b>Full Name:</b> {{ user.full_name }}</p>

    <p><b>Username:</b> {{ user.username }}</p>

    <p><b>Email:</b> {{ user.email }}</p>

    <p><b>Account Created:</b> {{ user.created_at }}</p>

    <a class="btn" href="{{ url_for('auth.logout') }}">Logout</a>

</div>

{% endblock %}
